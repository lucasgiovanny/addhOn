refresh:

set_log_level:
  fields:
    level:
      required: true
      default: debug
      example: debug
      selector:
        select:
          options:
            - "debug"
            - "info"
            - "warning"
            - "error"

set_mqtt_log_level:
  fields:
    level:
      required: true
      default: debug
      example: debug
      selector:
        select:
          options:
            - "debug"
            - "info"
            - "warning"
            - "error"

send_command:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: addhon
    command:
      required: true
      default: settings
      example: settings
      selector:
        text:
    parameters:
      required: true
      example: '{"operationName": "grSetVacDate", "vacStartDate": "2026-09-01"}'
      selector:
        object:
